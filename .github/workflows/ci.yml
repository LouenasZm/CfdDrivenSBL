name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples

      - name: Run tests
        run: pytest

      - name: Run the fast examples
        run: |
          python examples/01_sparse_pce_ishigami.py
          python examples/02_multimodal_polynomial.py

  # Single aggregate check to mark as "required" in the branch ruleset,
  # so changing the Python matrix never leaves PRs waiting on stale check names.
  ci-ok:
    needs: tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All test jobs passed
        run: test "${{ needs.tests.result }}" = "success"
