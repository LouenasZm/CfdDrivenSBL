[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sbl-cfd-driven"
version = "0.1.0"
description = "Nonlinear sparse Bayesian learning (NSBL) for CFD-driven discovery of sparse model corrections"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louenas Zemmour" }]
keywords = [
    "sparse Bayesian learning",
    "automatic relevance determination",
    "Bayesian inference",
    "symbolic regression",
    "RANS",
    "laminar-turbulent transition",
    "surrogate modelling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]
dev = ["pytest>=7", "matplotlib>=3.6", "ruff"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that run a full sampling stage"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = [
    "E741", # single-letter names follow the mathematical notation of the papers
    "B905", # zip() over arrays whose lengths are fixed by construction
]
